<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>iBanking · Học phí</title>
<style>body{font:16px system-ui;background:#f3f5f8;color:#18263c;max-width:850px;margin:40px auto;padding:0 20px}section{background:white;padding:24px;border-radius:12px;margin:20px 0}input,button{font:inherit;padding:10px;margin:5px 0;box-sizing:border-box}input{border:1px solid #bbc5d1;border-radius:6px}button{background:#175fbc;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{display:block;margin-top:12px}#notice{white-space:pre-wrap;color:#a12c22}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.scroll{overflow:auto}small{color:#526173}[hidden]{display:none!important}</style>
<h1>iBanking · Đóng học phí</h1><small>Bản thử: đăng nhập, thông tin tài khoản và tra cứu học phí.</small>
<p id="notice" role="status" aria-live="polite"></p>
<section id="loginPanel"><h2>Đăng nhập</h2><form id="loginForm"><label for="username">Tên đăng nhập</label><input id="username" autocomplete="username" required maxlength="50"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required maxlength="72"><br><button>Đăng nhập</button></form></section>
<div id="workspace" hidden><section><button id="logout" style="float:right">Đăng xuất</button><h2>Tài khoản</h2><div id="account"></div></section><section><h2>Tra cứu học phí</h2><form id="lookupForm"><label for="mssv">Mã số sinh viên</label><input id="mssv" placeholder="Ví dụ: SV001" maxlength="20" required><button>Tra cứu</button></form><div class="scroll" id="results"></div><p><small>Thanh toán và OTP sẽ được bổ sung ở bước tiếp theo.</small></p></section></div>
<script>
let token='';
const $=id=>document.getElementById(id);
const money=value=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(Number(value));
function logout(){token='';$('workspace').hidden=true;$('loginPanel').hidden=false;$('account').replaceChildren();$('results').replaceChildren();$('password').value='';}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok){if(r.status===401)logout();throw new Error(typeof data.detail==='string'?data.detail:'Thông tin nhập chưa hợp lệ');}return data;}
function line(parent,text,tag='p'){const el=document.createElement(tag);el.textContent=text;parent.append(el);return el;}
async function submit(form,work){$('notice').textContent='';const button=form.querySelector('button');button.disabled=true;try{await work();}catch(e){$('notice').textContent=e instanceof TypeError?'Không kết nối được máy chủ.':e.message;}finally{button.disabled=false;}}
$('loginForm').onsubmit=e=>{e.preventDefault();submit(e.target,async()=>{const data=await api('/api/auth/login',{username:$('username').value.trim(),password:$('password').value});token=data.token;const info=await api('/api/account/info');$('account').replaceChildren();for(const text of [info.full_name,`Điện thoại: ${info.phone||'Chưa có'}`,`Email: ${info.email}`,`Số dư: ${money(info.balance)}`])line($('account'),text);$('password').value='';$('loginPanel').hidden=true;$('workspace').hidden=false;});};
$('lookupForm').onsubmit=e=>{e.preventDefault();$('results').replaceChildren();submit(e.target,async()=>{const rows=await api('/api/tuition/'+encodeURIComponent($('mssv').value.trim()));const table=document.createElement('table');const head=document.createElement('tr');for(const title of ['Sinh viên','Học kỳ','Học phí','Trạng thái'])line(head,title,'th');table.append(head);for(const row of rows){const tr=document.createElement('tr');for(const value of [`${row.mssv} · ${row.student_name}`,row.semester,money(row.amount),row.status==='paid'?'Đã thanh toán':'Chưa thanh toán'])line(tr,value,'td');table.append(tr);}$('results').append(table);});};
$('logout').onclick=()=>{logout();$('notice').textContent='';};
</script></html>
